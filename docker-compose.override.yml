services:
  backend:
    volumes:
      - ./backend:/app
      - /app/.venv  # preserve container-built venv
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

  frontend:
    volumes:
      - ./frontend:/app
      - /app/node_modules   # preserve container-built node_modules
      - /app/.next          # preserve Next.js build cache
    environment:
      WATCHPACK_POLLING: "true"
