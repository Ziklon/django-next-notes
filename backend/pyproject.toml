[project]
name = "notes-backend"
version = "0.1.0"
description = "Notes app backend - Django + DRF API (Turbo AI challenge)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "django-filter>=24.0",
    "dj-database-url>=2.2",
    "psycopg2-binary>=2.9",
    "python-dotenv>=1.0",
    "gunicorn>=22.0",
    "djangorestframework-simplejwt>=5.5.1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "coverage[toml]>=7.6",
    "pytest>=9.0.3",
    "pytest-django>=4.12.0",
    "testcontainers[postgres]>=4.14.2",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
python_classes = ["*Tests", "*Test"]
python_functions = ["test_*"]

[tool.uv]
# This is a deployable application, not an installable library.
package = false

[tool.coverage.run]
branch = true
source = ["notes", "config"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "config/wsgi.py",
    "config/asgi.py",
    "config/settings.py",
    "manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
